<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards Enem · Ciências da Natureza</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--sf:#151515;--ln:#2b2b2b;--mu:#8c8c8c;--fg:#f4f4f4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:auto;padding:32px 18px calc(40px + env(safe-area-inset-bottom))}
h1{font:400 56px/1 'Instrument Serif',Georgia,serif;margin:0 0 8px;letter-spacing:-1px}
.m{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:18px;margin:14px 0}
.q{font:400 24px/1.3 'Instrument Serif',Georgia,serif}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--ln);border-radius:4px;padding:14px;width:100%;text-align:left;margin:8px 0;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--mu)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg);text-align:center;font-weight:600}
button.ok{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ok::after{content:'  ✓';font-weight:700}
button.er{border-style:dashed;border-color:var(--mu);color:var(--mu);text-decoration:line-through}
button.er::after{content:'  ✕';display:inline-block;text-decoration:none}
.bar{height:2px;background:var(--ln);margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--fg)}
.big{font:400 128px/1 'Instrument Serif',Georgia,serif;letter-spacing:-4px;margin:4px 0}
.big small{font-size:48px;letter-spacing:0;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>
<script src="questoes.js"></script>
<script>
const K='enemcn_v1',A=document.getElementById('app');
const CARDS=Q.map((q,i)=>({i,t:q[0],q:q[1],o:q.slice(2,6),e:q[6]}));
let S,R;
try{S=JSON.parse(localStorage.getItem(K))||{c:{},r:[]}}catch(e){S={c:{},r:[]}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const err=x=>(x.no+1)/(x.ok+x.no+2);
function topics(){const t={};CARDS.forEach(c=>{const s=S.c[c.i]||{ok:0,no:0},x=t[c.t]=t[c.t]||{ok:0,no:0};x.ok+=s.ok;x.no+=s.no});return t}
function weak(){return Object.entries(topics()).filter(([,x])=>x.no>0).sort((a,b)=>err(b[1])-err(a[1])).slice(0,3)}
// sorteio ponderado: assuntos com mais erros ganham mais peso
function pick(){const t=topics();return CARDS.map(c=>{const w=4*err(t[c.t])**2+.2;return{c,k:Math.random()**(1/w)}}).sort((a,b)=>b.k-a.k).slice(0,15).map(x=>x.c)}
function home(){
  const t=topics();
  A.innerHTML=`<h1>Enem</h1><p class=m>Ciências da Natureza. ${CARDS.length} flashcards, rodadas de 15.</p>`+
  (S.r.length?`<div class=cd><b>Últimas rodadas</b><p class=m>${S.r.slice(-6).map(r=>r.p+'%').join('&ensp;/&ensp;')}</p></div>`:'')+
  `<div class=cd><b>Acerto por assunto</b>`+Object.entries(t).map(([k,x])=>{const a=x.ok+x.no;return `<div class=row style="margin-top:10px"><span>${k}</span><span class=m>${a?pct(x.ok,a)+'%':'sem dados'}</span></div><div class=bar><i style="width:${pct(x.ok,a)}%"></i></div>`}).join('')+`</div>
  <button class=p onclick=start()>Começar rodada</button>
  <button onclick="if(confirm('Apagar todo o progresso?')){S={c:{},r:[]};save();home()}">Zerar progresso</button>`;
}
function start(){R={q:pick(),n:0,ok:0,by:{},d:0};quiz()}
function quiz(){
  const c=R.q[R.n];R.d=0;R.o=sh([0,1,2,3]);
  A.innerHTML=`<div class=row><span class=m>${c.t}</span><span class=m>${R.n+1}/${R.q.length}</span></div><div class=bar><i style="width:${R.n/R.q.length*100}%"></i></div><div class=cd><span class=q>${c.q}</span></div>`+
  R.o.map((j,k)=>`<button onclick=ans(${k})>${'ABCD'[k]}) ${c.o[j]}</button>`).join('')+'<div id=fb></div>';
}
function ans(k){
  if(R.d)return;R.d=1;
  const c=R.q[R.n],ok=R.o[k]===0,b=A.querySelectorAll('button');
  R.o.forEach((j,x)=>{if(j===0)b[x].className='ok';else if(x===k)b[x].className='er'});
  const s=S.c[c.i]=S.c[c.i]||{ok:0,no:0};ok?s.ok++:s.no++;
  const y=R.by[c.t]=R.by[c.t]||{ok:0,no:0};ok?y.ok++:y.no++;
  R.ok+=ok?1:0;save();
  document.getElementById('fb').innerHTML=`<div class=cd><b>${ok?'Acertou!':'Errou.'}</b><br>${c.e}</div><button class=p onclick=nx()>${R.n<R.q.length-1?'Próxima':'Ver resultado'}</button>`;
}
function nx(){R.n++;R.n<R.q.length?quiz():fim()}
function fim(){
  const p=pct(R.ok,R.q.length);S.r.push({d:Date.now(),p,n:R.q.length});save();
  const w=weak();
  A.innerHTML=`<p class=m>Rodada ${S.r.length} concluída</p><div class=big>${p}<small>%</small></div><p>${R.ok} de ${R.q.length} certas</p>
  <div class=cd><b>Nesta rodada</b>`+Object.entries(R.by).map(([k,x])=>`<div class=row><span>${k}</span><span class=m>${x.ok}/${x.ok+x.no}</span></div>`).join('')+`</div>`+
  (w.length?`<div class=cd><b>Foque em:</b><br>${w.map(([k,x])=>`${k} (${pct(x.ok,x.ok+x.no)}% de acerto)`).join('<br>')}<p class=m>As próximas rodadas trazem mais perguntas desses assuntos.</p></div>`:'')+
  `<button class=p onclick=start()>Próxima rodada</button><button onclick=home()>Início</button>`;
}
home();
</script></body></html>
